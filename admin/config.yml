backend:
  name: turbo-github
  turbo_site_id: 539b0b2b-a2ea-4fd9-8a57-cdbbbd1ae0d8
  branch: main

media_folder: assets
public_folder: /assets

editor:
  preview: false

collections:
  - name: pages
    label: Website content
    files:
      - name: homepage
        label: Homepage
        file: content/home.json
        format: json
        fields:
          - { label: Browser title, name: page_title, widget: string }
          - { label: Search description, name: meta_description, widget: text }
          - { label: Small heading, name: eyebrow, widget: string }
          - { label: First name, name: first_name, widget: string }
          - { label: Last name, name: last_name, widget: string }
          - { label: Main statement, name: role, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Focus label, name: focus_label, widget: string }
          - { label: Focus title, name: focus_title, widget: string }
          - { label: Focus description, name: focus_description, widget: text }
          - label: Focus metrics
            name: focus_metrics
            widget: list
            min: 2
            max: 2
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - { label: Research section title, name: research_section_title, widget: string }
          - label: Projects
            name: projects
            widget: list
            min: 2
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Image description, name: alt, widget: string }
              - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - label: Headline metrics
                name: metrics
                widget: list
                min: 3
                max: 3
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - { label: Page link, name: link, widget: string }
          - { label: Footer, name: footer_text, widget: string }

      - name: bitcoin_research
        label: Bitcoin research page
        file: content/bitcoin.json
        format: json
        fields:
          - { label: Browser title, name: page_title, widget: string }
          - { label: Search description, name: meta_description, widget: text }
          - { label: Small heading, name: eyebrow, widget: string }
          - { label: Page title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: text }
          - { label: Summary heading, name: summary_title, widget: string }
          - label: Headline metrics
            name: summary_metrics
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
              - label: Color
                name: tone
                widget: select
                options:
                  - { label: Neutral, value: "" }
                  - { label: Green, value: positive }
                  - { label: Orange, value: risk }
          - { label: Research bullets, name: summary_bullets, widget: list, field: { label: Bullet, name: bullet, widget: text } }
          - { label: Data section heading, name: data_title, widget: string }
          - label: Data overview
            name: data_rows
            widget: list
            min: 4
            max: 4
            fields:
              - { label: Block, name: block, widget: string }
              - { label: Frequency, name: frequency, widget: string }
              - { label: Content, name: content, widget: text }
              - { label: Source, name: source, widget: string }
          - { label: Data sample and cleaning note, name: data_note, widget: text }
          - { label: Signal analysis introduction, name: signal_intro, widget: text }
          - label: Charts
            name: figures
            widget: list
            min: 5
            max: 5
            fields:
              - { label: Section label, name: kicker, widget: string }
              - { label: Section heading, name: title, widget: string }
              - { label: Key insight, name: insight, widget: text }
              - { label: Chart image, name: image, widget: image }
              - { label: Image description, name: alt, widget: string }
              - { label: Caption, name: caption, widget: text }
          - label: Composite-score rules
            name: scoring_rows
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Factor, name: factor, widget: string }
              - { label: Maximum points, name: points, widget: string }
              - { label: Scoring rule, name: rule, widget: text }
          - label: Strategy rules
            name: strategy_rows
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Price zone, name: zone, widget: string }
              - label: Zone color
                name: tone
                widget: select
                options:
                  - { label: Low / green, value: low }
                  - { label: Mid / yellow, value: mid }
                  - { label: High / red, value: high }
              - { label: Strategy rule, name: rule, widget: text }
              - { label: Rationale, name: rationale, widget: text }
          - { label: Strategy note, name: strategy_note, widget: text }
          - label: Performance results
            name: result_rows
            widget: list
            min: 2
            max: 2
            fields:
              - { label: Approach, name: approach, widget: string }
              - { label: Cumulative return, name: return, widget: string }
              - { label: Maximum drawdown, name: drawdown, widget: string }
              - { label: Sharpe ratio, name: sharpe, widget: string }
              - { label: Calmar ratio, name: calmar, widget: string }
          - { label: Results takeaway, name: result_summary, widget: text }
          - { label: Footer note, name: footer_text, widget: text }

      - name: cxmt_research
        label: CXMT arbitrage research page
        file: content/cxmt.json
        format: json
        fields:
          - { label: Browser title, name: page_title, widget: string }
          - { label: Search description, name: meta_description, widget: text }
          - { label: Small heading, name: eyebrow, widget: string }
          - { label: Page title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: text }
          - { label: Summary heading, name: summary_title, widget: string }
          - label: Headline metrics
            name: summary_metrics
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
              - label: Color
                name: tone
                widget: select
                options:
                  - { label: Neutral, value: "" }
                  - { label: Green, value: positive }
                  - { label: Blue, value: risk }
          - { label: Research bullets, name: summary_bullets, widget: list, field: { label: Bullet, name: bullet, widget: text } }
          - { label: Data section heading, name: data_title, widget: string }
          - label: Data overview
            name: data_rows
            widget: list
            min: 4
            max: 4
            fields:
              - { label: Block, name: block, widget: string }
              - { label: Frequency, name: frequency, widget: string }
              - { label: Content, name: content, widget: text }
              - { label: Source, name: source, widget: string }
          - { label: Data sample note, name: data_note, widget: text }
          - { label: Research-window finding, name: basis_in_sample, widget: string }
          - { label: Out-of-sample finding, name: basis_out_sample, widget: string }
          - { label: Basis explanation, name: basis_explanation, widget: text }
          - { label: Funding mechanism, name: funding_explanation, widget: text }
          - { label: Funding interpretation, name: funding_note, widget: text }
          - label: Funding decay observations
            name: funding_decay_rows
            widget: list
            min: 6
            max: 6
            fields:
              - { label: Time, name: time, widget: string }
              - { label: Funding rate, name: rate, widget: string }
              - { label: Bar width, name: width, widget: string, hint: "Use a percentage, for example 42.6%" }
          - { label: Intraday feasibility note, name: intraday_note, widget: text }
          - { label: Interday rule, name: interday_rule, widget: text }
          - label: Interday results
            name: interday_rows
            widget: list
            min: 2
            max: 2
            fields:
              - { label: Sample, name: sample, widget: string }
              - { label: Trades, name: trades, widget: string }
              - { label: Win rate, name: win_rate, widget: string }
              - { label: Basis, name: basis, widget: string }
              - { label: Funding, name: funding, widget: string }
              - { label: Cost, name: cost, widget: string }
              - { label: Net, name: net, widget: string }
          - label: A/H continuation results
            name: continuation_rows
            widget: list
            min: 2
            max: 2
            fields:
              - { label: Approach, name: approach, widget: string }
              - { label: Sample result, name: result, widget: text }
              - { label: Interpretation, name: meaning, widget: text }
          - { label: Footer note, name: footer_text, widget: text }
